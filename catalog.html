<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog - Boosted USA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top_cap">Financing option available at checkout.</div>
    <div class="top_menu_under_cap">
        <div class="logotype_block_in_top_menu_under_cap">
            <img class="logotype_in_top_menu_under_cap" src="Rectangle (1).svg" alt="Boosted USA Logo">
        </div>
        <div class="middle_block_in_top_menu_under_cap">
            <a href="index.html">BACK TO HOME</a> </div>
    </div>

    <div class="accessories_section" style="margin-top: 50px;">
        <div class="title_block_in_accessories">
            <div class="title_text_in_accessories">All Products</div>
            <div class="grey_line_in_accessories"></div>
        </div>

        <div style="display: flex; gap: 20px; justify-content: center; align-items: center; margin-bottom: 20px; max-width: 1200px; padding: 20px; background-color: #f5f5f5; border-radius: 8px;">
            
            <input type="text" id="searchInput" placeholder="Поиск по названию..." style="padding: 10px 15px; width: 300px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-family: 'Roboto', sans-serif;">

            <select id="categorySelect" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; outline: none; font-family: 'Roboto', sans-serif;">
                <option value="All">Все категории</option>
                <option value="Boards">Скейтборды</option>
                <option value="Scooters">Самокаты</option>
                <option value="Gear">Экипировка</option>
                <option value="Accessories">Аксессуары</option>
            </select>

            <select id="sortSelect" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; outline: none; font-family: 'Roboto', sans-serif;">
                <option value="default">Сортировка по умолчанию</option>
                <option value="priceAsc">Сначала дешевые</option>
                <option value="priceDesc">Сначала дорогие</option>
                <option value="nameAsc">По названию (А-Я)</option>
                <option value="ratingDesc">По высокому рейтингу</option>
            </select>
        </div>

        <div class="filters-container" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 40px; max-width: 1200px;">
            <button id="btn-filter" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Скейтборды (Filter)</button>
            <button id="btn-reduce" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Аксессуары (Reduce)</button>
            <button id="btn-flatmap" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Экипировка (FlatMap)</button>
            
            <button id="btn-sort" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Сначала дешевые (Sort)</button>
            <button id="btn-reverse" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Изменить порядок (Reverse)</button>
            <button id="btn-map" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Скидка -20% (Map)</button>
            
            <button id="btn-slice" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Топ-4 товара (Slice)</button>
            <button id="btn-find" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Флагман за $3000+ (Find)</button>
            <button id="btn-concat" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Загрузить еще (Concat)</button>
            
            <button id="btn-shift" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Скрыть первый (Shift)</button>
            <button id="btn-pop" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Скрыть последний (Pop)</button>
            <button id="btn-splice" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer;">Удалить 3 товара (Splice)</button>
            
            <button id="btn-reset" class="red_button_in_photo" style="width: auto; padding: 0 15px; cursor: pointer; background-color: #333;">СБРОСИТЬ ВСЁ</button>
        </div>

        <div id="catalog-container" class="items_row_in_accessories" style="flex-wrap: wrap; max-width: 1200px; gap: 30px; justify-content: center;">
            
        </div>

        <div id="catalog-container" class="items_row_in_accessories" style="flex-wrap: wrap; max-width: 1200px; gap: 30px;">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
