<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Boosted USA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top_cap">Financing option available at checkout.</div>
    <div class="top_menu_under_cap">
        <div class="logotype_block_in_top_menu_under_cap">
            <img class="logotype_in_top_menu_under_cap" src="Rectangle (1).svg" alt="Boosted USA Logo">
        </div>
        <div class="middle_block_in_top_menu_under_cap">
            <a href="catalog.html">BACK TO CATALOG</a> 
        </div>
    </div>

    <div class="accessories_section" style="margin-top: 50px;">
        <div class="title_block_in_accessories">
            <div class="title_text_in_accessories">Корзина покупок</div>
            <div class="grey_line_in_accessories"></div>
        </div>

        <div style="display: flex; gap: 40px; max-width: 1200px; margin-top: 40px; justify-content: center; align-items: flex-start; flex-wrap: wrap;">
            
            <div id="cart-container" style="display: flex; flex-direction: column; gap: 20px; width: 600px;">
                </div>

            <div style="width: 300px; padding: 30px; background-color: #f9f9f9; border-radius: 10px; text-align: center;">
                <h3 style="font-family: 'Roboto'; font-size: 24px; margin-bottom: 20px;">Итого: <span id="total-price" style="color: #FF5A45;">$0.00</span></h3>
                <button onclick="checkout()" style="width: 100%; background: #FF5A45; color: white; border: none; padding: 15px; border-radius: 25px; cursor: pointer; font-family: 'Roboto'; font-weight: 700; font-size: 16px; transition: 0.3s;">Оформить заказ</button>
            </div>
            
        </div>
    </div>

    <script>
        const cartContainer = document.getElementById('cart-container');
        const totalPriceEl = document.getElementById('total-price');
        let currentCartItems = [];

        async function loadCart() {
            try {
                const res = await fetch('http://localhost:3000/cart');
                currentCartItems = await res.json();
                renderCart(currentCartItems);
                calculateTotal(currentCartItems);
            } catch (error) {
                console.error('Ошибка загрузки корзины:', error);
            }
        }

        function renderCart(items) {
            if (items.length === 0) {
                cartContainer.innerHTML = `
                    <div style="text-align: center; padding: 50px 0;">
                        <h2 style="color: #777; font-family: 'Roboto', sans-serif;">Корзина пуста</h2>
                    </div>`;
                return;
            }

            let html = '';
            items.forEach(item => {
                html += `
                    <div style="display: flex; align-items: center; justify-content: space-between; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                        <img src="${item.image}" style="width: 80px; height: 80px; object-fit: contain;">
                        <div style="flex-grow: 1; margin-left: 20px; font-family: 'Roboto';">
                            <div style="font-size: 16px; font-weight: 700;">${item.name}</div>
                            <div style="color: #FF5A45; font-weight: 700; margin-top: 5px;">$${Number(item.price).toFixed(2)}</div>
                        </div>
                        
                        <div style="display: flex; align-items: center; gap: 10px; margin-right: 20px;">
                            <button onclick="updateQuantity('${item.id}', ${item.quantity - 1})" style="width: 30px; height: 30px; border: 1px solid #ccc; background: white; cursor: pointer;">-</button>
                            <span style="font-family: 'Roboto'; font-weight: 700;">${item.quantity}</span>
                            <button onclick="updateQuantity('${item.id}', ${item.quantity + 1})" style="width: 30px; height: 30px; border: 1px solid #ccc; background: white; cursor: pointer;">+</button>
                        </div>

                        <button onclick="removeFromCart('${item.id}')" style="background: transparent; border: none; color: #FF2121; cursor: pointer; font-size: 20px;">❌</button>
                    </div>
                `;
            });
            cartContainer.innerHTML = html;
        }

        function calculateTotal(items) {
            const total = items.reduce((sum, item) => sum + (Number(item.price) * item.quantity), 0);
            totalPriceEl.textContent = `$${total.toFixed(2)}`;
        }

        async function updateQuantity(id, newQuantity) {
            if (newQuantity < 1) return;
            try {
                await fetch(`http://localhost:3000/cart/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity: newQuantity })
                });
                loadCart(); 
            } catch (error) {
                console.error('Ошибка обновления количества:', error);
            }
        }

        async function removeFromCart(id) {
            try {
                await fetch(`http://localhost:3000/cart/${id}`, {
                    method: 'DELETE'
                });
                loadCart();
            } catch (error) {
                console.error('Ошибка удаления из корзины:', error);
            }
        }

        async function checkout() {
        if (currentCartItems.length === 0) {
            alert("Ваша корзина пуста!");
            return;
        }

        try {
            const savedUser = localStorage.getItem('currentUser');
            const userId = savedUser ? JSON.parse(savedUser).id : "guest";
            const orderItem = { 
                userId: userId, 
                items: currentCartItems, 
                id: Date.now().toString() 
            }; 
            
            await fetch('http://localhost:3000/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderItem)
            });
            
            for (let item of currentCartItems) {
                await fetch(`http://localhost:3000/cart/${item.id}`, {
                    method: 'DELETE'
                });
            }

            alert('✅ Заказ оформлен!');
            loadCart();
        } catch (error) {
            console.error('Ошибка при оформлении заказа:', error);
        }
    }
    loadCart();
    </script>
</body>
</html>
